[package]
name = "sharek"
version.workspace = true
edition.workspace = true

[dependencies]
sharek-common.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
png.workspace = true
tiny-skia.workspace = true
zbus = { workspace = true, features = ["blocking-api"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
ksni = { version = "0.3.7", default-features = false, features = ["async-io"] }
futures-lite = "2"
