[workspace]
resolver = "3"
members = ["crates/common", "crates/daemon", "crates/editor", "crates/gif", "crates/ocr"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
sharek-common = { path = "crates/common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
png = "0.18"
jpeg-encoder = "0.7"
zune-jpeg = "0.5.15"
zune-core = "0.5"
zbus = { version = "5", default-features = false, features = ["async-io"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "apple-layout", "variable-fonts", "glyph-names"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
